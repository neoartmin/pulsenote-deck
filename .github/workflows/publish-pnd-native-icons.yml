name: Publish authentic v7.5.22 Windows icon artwork for website
on:
  push:
    branches: [feature/pnd-auto-click-audio-notifications-dark-theme]
    paths:
      - '.github/workflows/publish-pnd-native-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    if: github.repository == 'neoartmin/pulsenote-deck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Generate application and action icons from current Windows source
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/generate_pnd_icon.py
          mkdir -p out
          cp Windows/소스/app/assets/auto_click.png out/PulseNoteDeck_auto_click.png
          cp Windows/소스/app/assets/audio_output.png out/PulseNoteDeck_audio_output.png
          cp Windows/소스/app/assets/app_logo.png out/PulseNoteDeck_app_logo.png
      - name: Publish exactly generated icon PNGs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload pnd-windows-v7.5.22 \
            out/PulseNoteDeck_auto_click.png \
            out/PulseNoteDeck_audio_output.png \
            out/PulseNoteDeck_app_logo.png \
            --repo neoartmin/pulsenote-deck --clobber
