name: Publish verified Windows preview from source version
on:
  push:
    branches: [feature/pnd-auto-click-audio-notifications-dark-theme]
    paths:
      - '.github/workflows/pnd-preview-release.yml'
      - 'Windows/소스/app/**'
      - 'Windows/소스/installer/**'
      - 'tools/generate_pnd_icon.py'
      - 'tools/prepare_pretendard.py'
      - 'tools/create_backup_archive.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pnd-preview-release
  cancel-in-progress: true
jobs:
  release:
    if: github.repository == 'neoartmin/pulsenote-deck'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Read and verify matching app/installer version
        shell: pwsh
        run: |
          $app = Get-Content 'Windows/소스/app/model.go' -Raw -Encoding utf8
          $setup = Get-Content 'Windows/소스/installer/version.go' -Raw -Encoding utf8
          if ($app -notmatch 'const version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'Missing app version' }
          $version = $Matches[1]
          if ($setup -notmatch 'const productVersion\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'Missing installer version' }
          if ($version -ne $Matches[1]) { throw "Version mismatch app=$version installer=$($Matches[1])" }
          "PND_VERSION=$version" >> $env:GITHUB_ENV
          "PND_TAG=pnd-windows-v$version" >> $env:GITHUB_ENV
          Write-Host "Preparing v$version"
      - name: Preserve immutable published version archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:PND_TAG
          $uri = "https://api.github.com/repos/$repo/releases/tags/$tag"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "PulseNoteDeck-Windows-Release-CI"
          }
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            throw "Version $tag already exists. Bump the source version before publishing new binaries."
          }
          if ($response.StatusCode -ne 404) {
            throw "Cannot check release $tag, API HTTP $($response.StatusCode)"
          }
          Write-Host "New preview tag is available: $tag"
      - name: Generate resources and test app
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_pnd_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_pretendard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location 'Windows/소스/app'
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico PulseNoteDeck.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location 'Windows/소스/installer'
          go run github.com/akavel/rsrc@v0.10.2 -manifest ../app/app.manifest -ico icon.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Build dynamically named setup and full backup
        shell: pwsh
        run: |
          $version = $env:PND_VERSION
          $exeName = "PulseNoteDeck_v$($version).exe"
          $setupName = "PulseNoteDeck_v$($version)_Setup_preview.exe"
          $backupName = "PulseNoteDeck_v$($version)_COMPLETE_BACKUP.zip"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Push-Location 'Windows/소스/app'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o "../../../out/$exeName" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item (Join-Path out $exeName) 'Windows/소스/installer/app.bin' -Force
          Push-Location 'Windows/소스/installer'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H windowsgui' -o "../../../out/$setupName" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          python tools/create_backup_archive.py --app (Join-Path out $exeName) --installer (Join-Path out $setupName) --output (Join-Path out $backupName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub prerelease after successful tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:PND_VERSION
          $setupName = "PulseNoteDeck_v$($version)_Setup_preview.exe"
          $backupName = "PulseNoteDeck_v$($version)_COMPLETE_BACKUP.zip"
          gh release create $env:PND_TAG (Join-Path out $setupName) (Join-Path out $backupName) --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PulseNote Deck Windows v$version (Preview)" --notes "Windows preview automatically built from source version v$version. Windows multi-device USB hardware validation is pending." --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
