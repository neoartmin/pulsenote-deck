name: PN12 Android APK
on:
  push:
    branches: [main, android-pn12-apk-build, feature/pn15-grip]
    paths:
      - 'android-pn12/**'
      - 'Firmware/**'
      - 'tools/firmware_sync.py'
      - '.github/workflows/pn12-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: pn15-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled firmware is canonical
        run: python3 tools/firmware_sync.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-pn12
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseNote-PN12-Android-USB-APK
          path: android-pn12/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Assemble complete Android package (APK, sources, PN12 and PN15 L/R firmware)
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android-pn12/app/build.gradle.kts | head -n1)
          PKG="PND_Android_v${VERSION}_PN12_PN15_Complete"
          ROOT="${RUNNER_TEMP}/${PKG}"
          mkdir -p "${ROOT}/APK" "${ROOT}/Sources"
          cp android-pn12/app/build/outputs/apk/debug/app-debug.apk "${ROOT}/APK/PulseNote_PN12_PN15_Android_v${VERSION}.apk"
          git archive HEAD android-pn12 Firmware | tar -x -C "${ROOT}/Sources"
          cat > "${ROOT}/README_KO.txt" <<'EOF'
          PulseNote Deck Android PN12 + PN15 - 전체 파일집
          APK/     : Android 설치 파일 (디버그 서명)
          Sources/android-pn12 : Android 앱 전체 소스 (Gradle/Java/리소스)
          Sources/Firmware/PN12: PN12 ESP32-C3 펌웨어
          Sources/Firmware/PN15: PN15 RIGHT ESP32-C3 펌웨어
          Sources/Firmware/PN15_LEFT: PN15 LEFT ESP32-C3 펌웨어
          
          USB CDC 프로토콜: PND:HELLO / PND:READY:2.1 /
          PND:INFO:12:C3 / PN15:R:C3 / PN15:L:C3 / KEY:1..12 또는 KEY:1..15
          PN15 USB 식별 전문: PND:INFO:15:R:C3 / PND:INFO:15:L:C3
          Firmware/ 폴더만 공통 원본입니다. Windows 설치기와 동일한 파일을 포함합니다.
          Android 8.0(API26) 이상, USB OTG/호스트, USB 권한 필요
          GitHub Actions Gradle debug build. 실제 PN15 장치에서 테스트하지 않음.
          서명이 다른 이전 APK와의 덮어쓰기 업데이트는 실패할 수 있습니다.
          EOF
          (cd "${ROOT}" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "${RUNNER_TEMP}" && zip -qr "${PKG}.zip" "${PKG}")
          test -s "${RUNNER_TEMP}/${PKG}.zip"
          echo "COMPLETE_ARCHIVE=${RUNNER_TEMP}/${PKG}.zip" >> "$GITHUB_ENV"
      - name: Upload full Android package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseNote-Android-Complete
          path: ${{ env.COMPLETE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android-pn12/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          RELEASE_TAG="pn12-pn15-android-v${VERSION}"
          APK_NAME="PulseNote_PN12_PN15_Android_v${VERSION}.apk"
          cp android-pn12/app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/${APK_NAME}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/${APK_NAME}" "$COMPLETE_ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "${RUNNER_TEMP}/${APK_NAME}" "$COMPLETE_ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "PulseNote Deck PN12 + PN15 Android v${VERSION}" \
              --notes "Direct APK download for PulseNote PN12/PN15 Android. Debug-signed testing build; real device verification required." \
              --prerelease
          fi
