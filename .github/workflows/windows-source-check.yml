name: Windows Source Validation

on:
  pull_request:
    paths:
      - 'Windows/소스/app/**'
      - 'Windows/소스/installer/**'
      - '.github/workflows/windows-source-check.yml'

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test, vet, and compile Windows application
        shell: pwsh
        working-directory: Windows/소스/app
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H windowsgui' -o "$env:RUNNER_TEMP/PulseNoteDeck.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and create preview setup
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP/PulseNoteDeck.exe" "Windows/소스/installer/app.bin" -Force
          Push-Location "Windows/소스/installer"
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H windowsgui' -o "$env:RUNNER_TEMP/PulseNoteDeck_v7.5.20_Setup_preview.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: PND-v7.5.20-Windows-Preview-Setup
          path: ${{ runner.temp }}/PulseNoteDeck_v7.5.20_Setup_preview.exe
          retention-days: 14
          if-no-files-found: error
