name: Windows Source Validation

on:
  pull_request:
    paths:
      - 'Windows/소스/app/**'
      - 'Windows/소스/installer/**'
      - 'tools/generate_pnd_icon.py'
      - 'tools/prepare_pretendard.py'
      - '.github/workflows/windows-source-check.yml'

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build matching action icons and desktop shortcut ICO
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_pnd_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Pretendard and embed matching Windows icons
        shell: pwsh
        run: |
          python tools/prepare_pretendard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location 'Windows/소스/app'
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico PulseNoteDeck.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location 'Windows/소스/installer'
          go run github.com/akavel/rsrc@v0.10.2 -manifest ../app/app.manifest -ico icon.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Test, vet, and compile Windows application
        shell: pwsh
        working-directory: Windows/소스/app
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H windowsgui' -o "$env:RUNNER_TEMP/PulseNoteDeck.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and create preview setup
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP/PulseNoteDeck.exe" "Windows/소스/installer/app.bin" -Force
          Push-Location "Windows/소스/installer"
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H windowsgui' -o "$env:RUNNER_TEMP/PulseNoteDeck_v7.5.22_Setup_preview.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: PND-v7.5.22-Windows-Preview-Setup
          path: ${{ runner.temp }}/PulseNoteDeck_v7.5.22_Setup_preview.exe
          retention-days: 14
          if-no-files-found: error
