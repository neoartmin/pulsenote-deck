name: Windows PN12 + PN15 LEFT/RIGHT - Build and Complete ZIP
on:
  push:
    branches: [main, feature/pn15-grip, feature/firmware-canonical-sync]
    paths:
      - 'Windows/소스/**'
      - 'Windows/설치/**'
      - 'Windows/펌웨어/**'
      - 'Firmware/**'
      - 'tools/firmware_sync.py'
      - '.github/workflows/pn12-pn15-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows mirrors and embedded sketches match Firmware/
        shell: pwsh
        run: |
          python tools/firmware_sync.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Push-Location 'Windows/소스/app'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o '../../../out/PulseNoteDeck.exe' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item 'out/PulseNoteDeck.exe' 'Windows/소스/installer/app.bin' -Force
          Push-Location 'Windows/소스/installer'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o '../../../out/PulseNoteDeck_v7.5.8_Setup.exe' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Check all Go tests
        shell: pwsh
        run: |
          Push-Location 'Windows/소스/app'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location 'Windows/소스/installer'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Stage rebuilt installer and current Windows SHA256 manifest
        shell: pwsh
        run: |
          Copy-Item 'out/PulseNoteDeck_v7.5.8_Setup.exe' 'Windows/설치/PulseNoteDeck_v7.5.8_Setup.exe' -Force
          $original = 'Windows/SHA256SUMS_ORIGINAL_v7.5.8.txt'
          if (!(Test-Path -LiteralPath $original)) {
            Copy-Item -LiteralPath 'Windows/SHA256SUMS.txt' -Destination $original -Force
          }
          $root = (Resolve-Path -LiteralPath Windows).Path
          $checksum = Join-Path $root 'SHA256SUMS.txt'
          $generatedEmbed = Join-Path $root '소스/installer/app.bin'
          $entries = @(
            Get-ChildItem -LiteralPath $root -Recurse -File |
              Where-Object { $_.FullName -ne $checksum -and $_.FullName -ne $generatedEmbed } |
              Sort-Object FullName |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $relative = $_.FullName.Substring($root.Length + 1).Replace([char]92, '/')
                "$hash  $relative"
              }
          )
          [System.IO.File]::WriteAllLines($checksum, $entries,
            [System.Text.UTF8Encoding]::new($false))
      - name: Bundle Windows original files and rebuilt installer
        shell: pwsh
        run: |
          $stage = 'out/PND_Windows_v7.5.8_PN12_PN15_Complete'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -LiteralPath Windows -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force
          }
          Copy-Item 'out/PulseNoteDeck_v7.5.8_Setup.exe' (Join-Path $stage '설치/PulseNoteDeck_v7.5.8_Setup.exe') -Force
          # app.bin is an untracked intermediate, not part of the source archive.
          Remove-Item -LiteralPath (Join-Path $stage '소스/installer/app.bin') -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath 'out/PND_Windows_v7.5.8_PN12_PN15_Complete.zip' -Force
      - name: Upload Windows full package
        uses: actions/upload-artifact@v4
        with:
          name: PND-Windows-v7.5.8-Complete
          path: out/PND_Windows_v7.5.8_PN12_PN15_Complete.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release with complete ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'pnd-windows-v7.5.8'
          $zip = 'out/PND_Windows_v7.5.8_PN12_PN15_Complete.zip'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title 'PulseNote Deck Windows v7.5.8' --notes 'Windows installer, complete original sources, PN12/PN15 L/R firmware; three-device hardware testing pending.' --prerelease
          }
      - name: Commit rebuilt canonical-firmware installer and manifests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Windows/설치/PulseNoteDeck_v7.5.8_Setup.exe' 'Windows/SHA256SUMS.txt' 'Windows/SHA256SUMS_ORIGINAL_v7.5.8.txt'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Sync tracked Windows setup binary with canonical PN12/PN15 firmware"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Windows installer and manifest already match the canonical firmware."
          }
