name: Publish v7.5.22 verified Windows preview
on:
  push:
    branches: [feature/pnd-auto-click-audio-notifications-dark-theme]
    paths:
      - '.github/workflows/pnd-preview-release.yml'
      - 'Windows/소스/app/**'
      - 'Windows/소스/installer/**'
      - 'tools/generate_pnd_icon.py'
      - 'tools/prepare_pretendard.py'
      - 'tools/create_backup_archive.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pnd-preview-release
  cancel-in-progress: true
jobs:
  release:
    if: github.repository == 'neoartmin/pulsenote-deck'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Generate resources and test app
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_pnd_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_pretendard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location 'Windows/소스/app'
          go run github.com/akavel/rsrc@v0.10.2 -manifest app.manifest -ico PulseNoteDeck.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location 'Windows/소스/installer'
          go run github.com/akavel/rsrc@v0.10.2 -manifest ../app/app.manifest -ico icon.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Build setup and full backup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Push-Location 'Windows/소스/app'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o '../../../out/PulseNoteDeck_v7.5.22.exe' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item 'out/PulseNoteDeck_v7.5.22.exe' 'Windows/소스/installer/app.bin' -Force
          Push-Location 'Windows/소스/installer'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H windowsgui' -o '../../../out/PulseNoteDeck_v7.5.22_Setup_preview.exe' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          python tools/create_backup_archive.py --app out/PulseNoteDeck_v7.5.22.exe --installer out/PulseNoteDeck_v7.5.22_Setup_preview.exe --output out/PulseNoteDeck_v7.5.22_COMPLETE_BACKUP.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub prerelease after successful tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'pnd-windows-v7.5.22'
          $exe = 'out/PulseNoteDeck_v7.5.22_Setup_preview.exe'
          $zip = 'out/PulseNoteDeck_v7.5.22_COMPLETE_BACKUP.zip'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip --clobber
          } else {
            gh release create $tag $exe $zip --target $env:GITHUB_SHA --title 'PulseNote Deck Windows v7.5.22 (Preview)' --notes 'Preview build with PerMonitorV2 DPI and improved UI sharpness. Windows USB multi-device hardware validation is pending.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
