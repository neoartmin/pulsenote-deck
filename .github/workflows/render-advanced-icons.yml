name: Render Advanced Action Icons
on:
  push:
    branches: [feature/add-nonduplicate-utilities-v141-v7516]
    paths:
      - 'tools/generate_advanced_action_icons.py'
      - '.github/workflows/render-advanced-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render transparent 512px PNG artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/generate_advanced_action_icons.py
          python tools/check_action_icon_sync.py
      - name: Commit identical shared PNGs to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Windows/소스/app/assets/' 'android-pn12/app/src/main/assets/action_icons/'
          if ! git diff --cached --quiet; then
            git commit -m "Add new PNG macro icons to both platform assets"
            # Other source edits may land during icon rendering. Rebase the
            # generated binaries before pushing; never force-push any ref.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
