name: PN12 Android APK
on:
  push:
    branches: [main, android-pn12-apk-build, feature/pn15-grip, feature/firmware-canonical-sync, feature/text-macro-windows-android]
    paths:
      - 'android-pn12/**'
      - 'Firmware/**'
      - 'tools/firmware_sync.py'
      - 'tools/check_action_icon_sync.py'
      - 'tools/check_android_permissions.py'
      - 'Windows/소스/app/assets/**'
      - '.github/workflows/pn12-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: pn15-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled firmware is canonical
        run: python3 tools/firmware_sync.py --check
      - name: Verify Android and PC icon PNG parity
        run: python3 tools/check_action_icon_sync.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test text macro Unicode expansion
        run: |
          mkdir -p "${RUNNER_TEMP}/macro-test"
          javac -encoding UTF-8 -d "${RUNNER_TEMP}/macro-test" \
            android-pn12/app/src/extended/java/kr/pulsenote/pn12usb/TextMacro.java \
            android-pn12/tests/TextMacroSelfTest.java
          java -cp "${RUNNER_TEMP}/macro-test" kr.pulsenote.pn12usb.TextMacroSelfTest
      - name: Test Android profile snapshots and supported edit shortcuts
        run: |
          mkdir -p "${RUNNER_TEMP}/parity-test"
          javac -encoding UTF-8 -d "${RUNNER_TEMP}/parity-test" \
            android-pn12/app/src/extended/java/kr/pulsenote/pn12usb/AndroidEditShortcut.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/ProfileSnapshot.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/UsbAutoConnectPolicy.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/CaptureSessionPolicy.java \
            android-pn12/tests/AndroidParitySelfTest.java \
            android-pn12/tests/CaptureSessionSelfTest.java
          java -cp "${RUNNER_TEMP}/parity-test" kr.pulsenote.pn12usb.AndroidParitySelfTest
          java -cp "${RUNNER_TEMP}/parity-test" kr.pulsenote.pn12usb.CaptureSessionSelfTest
      - name: Build standard and extended APKs
        working-directory: android-pn12
        run: gradle --no-daemon --stacktrace assembleStandardDebug assembleExtendedDebug
      - name: Verify merged manifests exclude Accessibility and Overlay in standard APK
        run: python3 tools/check_android_permissions.py
      - name: Verify standard APK has no accessibility code
        run: python3 tools/check_android_standard_clean.py
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseNote-PN12-Android-USB-APK
          path: |
            android-pn12/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            android-pn12/app/build/outputs/apk/extended/debug/app-extended-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Assemble complete Android package (APK, sources, PN12 and PN15 L/R firmware)
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android-pn12/app/build.gradle.kts | head -n1)
          PKG="PND_Android_v${VERSION}_PN12_PN15_Complete"
          ROOT="${RUNNER_TEMP}/${PKG}"
          mkdir -p "${ROOT}/APK" "${ROOT}/Sources"
          cp android-pn12/app/build/outputs/apk/standard/debug/app-standard-debug.apk "${ROOT}/APK/PulseNote_PN12_PN15_Android_v${VERSION}.apk"
          cp android-pn12/app/build/outputs/apk/extended/debug/app-extended-debug.apk "${ROOT}/APK/PulseNote_PN12_PN15_Android_v${VERSION}_Extended.apk"
          git archive HEAD android-pn12 Firmware | tar -x -C "${ROOT}/Sources"
          cat > "${ROOT}/README_KO.txt" <<'EOF'
          PulseNote Deck Android PN12 + PN15 - 전체 파일집
          APK/     : Android 설치 파일 2종 (CI 디버그 서명)
          기본 설치판(추천): PulseNote_PN12_PN15_Android_v1.3.9.apk
            접근성 서비스/관련 코드/메뉴 및 다른 앱 위에 표시 권한 없음.
            USB, 볼륨/미디어, 스크린샷, 앱/웹사이트 열기는 유지.
            편집 단축키(Ctrl+C/V/X/A), 화면 위 표시 기반 직접 실행은 제한.
          확장 설치판: PulseNote_PN12_PN15_Android_v1.3.9_Extended.apk
            접근성 서비스와 다른 앱 위 표시 권한 포함.
            사용자에게 Android 보안 경고 또는 설치 차단이 발생할 수 있음.
          Play 프로텍트 차단 시 보안 기능을 끄거나 우회하지 마세요.
          이 APK들은 임시 디버그 서명 버전이며 Play 프로텍트 통과를 보장하지 않습니다.
          Sources/android-pn12 : Android 앱 전체 소스 (Gradle/Java/리소스)
          Sources/Firmware/PN12: PN12 ESP32-C3 펌웨어
          Sources/Firmware/PN15: PN15 RIGHT ESP32-C3 펌웨어
          Sources/Firmware/PN15_LEFT: PN15 LEFT ESP32-C3 펌웨어
          
          USB CDC 프로토콜: PND:HELLO / PND:READY:2.1 /
          PND:INFO:12:C3 / PN15:R:C3 / PN15:L:C3 / KEY:1..12 또는 KEY:1..15
          PN15 USB 식별 전문: PND:INFO:15:R:C3 / PND:INFO:15:L:C3
          Firmware/ 폴더만 공통 원본입니다. Windows 설치기와 동일한 파일을 포함합니다.
          Android 8.0(API26) 이상, USB OTG/호스트, USB 권한 필요
          GitHub Actions Gradle debug build. 실제 PN15 장치에서 테스트하지 않음.
          서명이 다른 이전 APK와의 덮어쓰기 업데이트는 실패할 수 있습니다.
          EOF
          (cd "${ROOT}" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "${RUNNER_TEMP}" && zip -qr "${PKG}.zip" "${PKG}")
          test -s "${RUNNER_TEMP}/${PKG}.zip"
          echo "COMPLETE_ARCHIVE=${RUNNER_TEMP}/${PKG}.zip" >> "$GITHUB_ENV"
      - name: Upload full Android package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseNote-Android-Complete
          path: ${{ env.COMPLETE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android-pn12/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          RELEASE_TAG="pn12-pn15-android-v${VERSION}"
          APK_NAME="PulseNote_PN12_PN15_Android_v${VERSION}.apk"
          cp android-pn12/app/build/outputs/apk/standard/debug/app-standard-debug.apk "${RUNNER_TEMP}/${APK_NAME}"
          EXTENDED_NAME="PulseNote_PN12_PN15_Android_v${VERSION}_Extended.apk"
          cp android-pn12/app/build/outputs/apk/extended/debug/app-extended-debug.apk "${RUNNER_TEMP}/${EXTENDED_NAME}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/${APK_NAME}" "${RUNNER_TEMP}/${EXTENDED_NAME}" "$COMPLETE_ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "${RUNNER_TEMP}/${APK_NAME}" "${RUNNER_TEMP}/${EXTENDED_NAME}" "$COMPLETE_ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "PulseNote Deck PN12 + PN15 Android v${VERSION}" \
              --notes "Android v1.3.9 completely removes accessibility components and shortcut menus from the recommended standard APK. One approved MediaProjection remains active for repeated screenshots. Notification includes an explicit stop control. Standard APK has no AccessibilityService or overlay permission; extended APK keeps optional features. Both are debug-signed test builds; Play Protect approval and real-device behavior not guaranteed." \
              --prerelease
          fi
