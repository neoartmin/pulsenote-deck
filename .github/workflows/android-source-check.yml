name: Android Source Validation
on:
  pull_request:
    paths:
      - 'android-pn12/**'
      - '.github/workflows/android-source-check.yml'
      - 'Firmware/**'
      - 'tools/firmware_sync.py'

permissions:
  contents: read

jobs:
  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled firmware matches canonical sources
        run: python3 tools/firmware_sync.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run standalone Android JVM regressions
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/java-test"
          javac -encoding UTF-8 -d "${RUNNER_TEMP}/java-test" \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/TextMacro.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/AndroidEditShortcut.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/ProfileSnapshot.java \
            android-pn12/tests/TextMacroSelfTest.java \
            android-pn12/tests/AndroidParitySelfTest.java
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.TextMacroSelfTest
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.AndroidParitySelfTest
      - name: Compile Android debug APK
        working-directory: android-pn12
        run: gradle --no-daemon --stacktrace assembleDebug
