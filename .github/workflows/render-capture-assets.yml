name: Render Capture PNG Assets

on:
  push:
    branches: [fix/capture-png-render]
    paths:
      - 'tools/generate_capture_icon.py'
      - '.github/workflows/render-capture-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and render both platform assets
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/generate_capture_icon.py
          python tools/check_action_icon_sync.py
      - name: Commit byte-identical 512px PNG assets to source branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Windows/소스/app/assets/capture.png' 'android-pn12/app/src/main/assets/action_icons/capture.png'
          if ! git diff --cached --quiet; then
            git commit -m "Add shared 512px capture PNG assets for both platforms"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          else
            echo "Icon assets already up to date."
          fi
