name: Android Source Validation
on:
  pull_request:
    paths:
      - 'android-pn12/**'
      - '.github/workflows/android-source-check.yml'
      - 'Firmware/**'
      - 'tools/firmware_sync.py'
      - 'tools/check_action_icon_sync.py'
      - 'tools/check_android_permissionfree_icons.py'
      - 'tools/check_advanced_action_icons.py'
      - 'tools/check_android_permissions.py'
      - 'Windows/소스/app/assets/**'

permissions:
  contents: read

jobs:
  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled firmware matches canonical sources
        run: python3 tools/firmware_sync.py --check
      - name: Verify PC and Android action art parity
        run: python3 tools/check_action_icon_sync.py
      - name: Validate Android permission-free action artwork
        run: python3 tools/check_android_permissionfree_icons.py
      - name: Validate new advanced action icon artwork
        run: python3 tools/check_advanced_action_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run standalone Android JVM regressions
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/java-test"
          javac -encoding UTF-8 -d "${RUNNER_TEMP}/java-test" \
            android-pn12/app/src/extended/java/kr/pulsenote/pn12usb/TextMacro.java \
            android-pn12/app/src/extended/java/kr/pulsenote/pn12usb/AndroidEditShortcut.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/ProfileSnapshot.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/UsbAutoConnectPolicy.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/CaptureSessionPolicy.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/PermissionFreeActions.java \
            android-pn12/app/src/main/java/kr/pulsenote/pn12usb/QuickActions.java \
            android-pn12/tests/TextMacroSelfTest.java \
            android-pn12/tests/AndroidParitySelfTest.java \
            android-pn12/tests/CaptureSessionSelfTest.java \
            android-pn12/tests/PermissionFreeActionsSelfTest.java \
            android-pn12/tests/QuickActionsSelfTest.java
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.TextMacroSelfTest
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.AndroidParitySelfTest
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.CaptureSessionSelfTest
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.PermissionFreeActionsSelfTest
          java -cp "${RUNNER_TEMP}/java-test" kr.pulsenote.pn12usb.QuickActionsSelfTest
      - name: Compile Android debug APK
        working-directory: android-pn12
        run: gradle --no-daemon --stacktrace assembleStandardDebug assembleExtendedDebug
      - name: Validate merged APK manifests (standard excludes sensitive permissions)
        run: python3 tools/check_android_permissions.py
      - name: Verify standard APK contains no accessibility classes
        run: python3 tools/check_android_standard_clean.py
