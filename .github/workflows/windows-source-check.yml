name: Windows Source Validation

on:
  pull_request:
    paths:
      - 'Windows/소스/app/**'
      - '.github/workflows/windows-source-check.yml'

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test, vet, and compile Windows application
        shell: pwsh
        working-directory: Windows/소스/app
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o "$env:RUNNER_TEMP/PulseNoteDeck.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
