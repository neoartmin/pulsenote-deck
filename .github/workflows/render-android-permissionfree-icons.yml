name: Render Android Permission-Free Icons

on:
  push:
    branches: [feature/android-no-permission-actions-v140]
    paths:
      - 'tools/generate_android_permissionfree_icons.py'
      - '.github/workflows/render-android-permissionfree-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate four PNG icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/generate_android_permissionfree_icons.py
          python tools/check_action_icon_sync.py
      - name: Commit PNG artwork into this feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'android-pn12/app/src/main/assets/action_icons/copy_text.png' \
                     'android-pn12/app/src/main/assets/action_icons/system_settings.png' \
                     'android-pn12/app/src/main/assets/action_icons/open_timers.png' \
                     'android-pn12/app/src/main/assets/action_icons/open_alarms.png'
          if ! git diff --cached --quiet; then
            git commit -m "Add four high-resolution PNGs for permission-free Android actions"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
