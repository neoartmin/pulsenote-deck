name: Import verified Windows v7.5.8 package into monorepo
on:
  push:
    branches: [feature/pn15-grip]
    paths:
      - 'Windows/.import/part*.bin'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify original Windows ZIP and extract all paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib
          import io
          root = Path("Windows")
          parts = sorted((root / ".import").glob("part*.bin"))
          if len(parts) != 9:
              raise SystemExit(f"Expected 9 binary parts; got {len(parts)}")
          blob = b"".join(part.read_bytes() for part in parts)
          expected = "270f8839b092ca8726f159fd9474a440cb305d56cb687434cc1a2fb59b7dca25"
          if hashlib.sha256(blob).hexdigest() != expected:
              raise SystemExit("Windows ZIP SHA256 mismatch; refusing extraction")
          archive_root = "PND_Windows_v7.5.8_PN12_PN15_3Devices_전체파일집"
          with ZipFile(io.BytesIO(blob)) as package:
              members = package.infolist()
              if len(members) != 119:
                  raise SystemExit(f"Expected 119 original archive members; got {len(members)}")
              for item in members:
                  original = PurePosixPath(item.filename)
                  if not original.parts or original.parts[0] != archive_root:
                      raise SystemExit(f"Unexpected archive root: {item.filename}")
                  rel = PurePosixPath(*original.parts[1:])
                  if not rel.parts or any(p in ("..",".") for p in rel.parts):
                      raise SystemExit(f"Unsafe ZIP entry: {item.filename}")
                  target = root.joinpath(*rel.parts)
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(package.read(item))
          required = [
              "소스/app/go.mod", "소스/app/gui_windows.go",
              "소스/installer/go.mod", "소스/installer/main_windows.go",
              "설치/PulseNoteDeck_v7.5.8_Setup.exe",
              "펌웨어/PN12/PulseNoteDeck_PN12.ino",
              "펌웨어/PN15_LEFT/PulseNoteDeck_PN15_LEFT.ino",
              "펌웨어/PN15_RIGHT/PulseNoteDeck_PN15_RIGHT.ino"
          ]
          for name in required:
              if not (root / name).is_file():
                  raise SystemExit(f"Missing original file {name}")
          print(f"Verified original SHA256 {expected}. Extracted {len(members)} archive entries.")
          PY
      - name: Commit complete original Windows source, assets, installer and firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Windows
          if git diff --cached --quiet; then
            echo "All original Windows files already imported."
          else
            git commit -m "Import all Windows v7.5.8 original paths, installer, Go sources and firmware"
            git push origin HEAD:feature/pn15-grip
          fi
          echo "Windows sources imported. The separate Windows build can now be run via workflow_dispatch."
